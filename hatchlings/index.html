<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hatchling Hatchery</title>
<meta name="description" content="Newborn & Pediatric Hatchlings: tap an egg to hatch its baby monster and learn its condition.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Macondo+Swash+Caps&family=Macondo&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<link rel="stylesheet" href="hatch/page.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div class="stage">
  <canvas id="scene" aria-label="The hatchery: eggs on a shelf. Tap an egg to hatch it."></canvas>

  <header class="top">
    <p class="kicker">Newborn &amp; Pediatric</p>
    <h1>Hatchling Hatchery</h1>
    <p class="tally"><b id="count">0</b> of <span id="total">1</span> hatched <button type="button" id="reset">Put the eggs back</button></p>
  </header>

  <button type="button" class="back" id="back" hidden>&larr; Back to the shelf</button>
  <p class="hint" id="hint">Tap an egg to hatch it</p>
  <div class="pager" id="pager" hidden>
    <button type="button" class="arrow" id="prev" aria-label="Previous egg">&lsaquo;</button>
    <span class="dots" id="dots"></span>
    <button type="button" class="arrow" id="next" aria-label="Next egg">&rsaquo;</button>
  </div>

  <aside class="card" id="card" aria-live="polite" hidden>
    <div class="card-in">
      <p class="card-no" id="cardNo"></p>
      <h2 id="cardName"></h2>
      <p class="card-dis" id="cardDis"></p>
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="tab-body" id="tabBody" role="tabpanel"></div>
      <div class="card-acts">
        <button type="button" class="btn" id="cardBack">Back to the shelf</button>
        <button type="button" class="btn ghost" id="again">Hatch again</button>
      </div>
    </div>
  </aside>

  <div class="veil" id="veil"><span class="ember"></span><p>Warming the eggs&hellip;</p></div>
</div>
<script type="module" src="hatch/main.js"></script>
</body>
</html>
